<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glow Flight</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,300;1,600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#f3e9ff;--mute:#9a85b8}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px;transition:opacity 1s,visibility 1s}
.ui.hide{opacity:0;visibility:hidden;pointer-events:none}
.step{display:flex;flex-direction:column;align-items:center;gap:20px;animation:in 1.2s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(34px,8vw,60px)}
p.sub{color:var(--mute);max-width:32ch;line-height:1.55;font-size:15px}
.orb{width:92px;height:92px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff,#d070ff 35%,#6a1bd1 85%);box-shadow:0 0 40px #b44bff,0 0 90px #6a1bd1;animation:pulse 2s ease-in-out infinite;color:#25063d;font:600 15px Manrope,sans-serif}
.orb:focus-visible{outline:3px solid #fff;outline-offset:4px}
@keyframes pulse{50%{transform:scale(1.12)}}
#hud{position:fixed;left:0;right:0;top:calc(16px + env(safe-area-inset-top,0px));text-align:center;font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(34px,8vw,52px);color:#e9c9ff;text-shadow:0 0 18px #a020f0;pointer-events:none;transition:opacity 1s}
#msg{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));text-align:center;font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(20px,4.5vw,30px);padding:0 24px;opacity:0;transition:opacity 1.4s;pointer-events:none}
#msg.on{opacity:1}
.made{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:var(--mute);pointer-events:none}
@media (prefers-reduced-motion:reduce){.orb{animation:none}.step{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div class="ui" id="ui">
  <div class="step">
    <h1>Hello…</h1>
    <p class="sub">Tap the screen to keep the little light flying. Pass 10 gates to unlock a surprise.</p>
    <button class="orb" id="orb" aria-label="Start the game">Play</button>
  </div>
</div>
<div id="msg"></div>
<div class="made">Made by Shakhruz, only for you</div>
<script>
(function(){
var NAME='Farzona',GOAL=10,LAPS=20;
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,D=Math.min(window.devicePixelRatio||1,2),i;
var off=document.createElement('canvas'),octx=off.getContext('2d');
var stage='intro',stars=[],sparks=[],hearts=[],shoot=[],trail=[],pipes=[];
var P={x:0,y:0,vy:0},nameAt=0,started=false,score=0,inv=0,last=0,shake=0,u=0,prev=null,doneAt=0,winAt=0,fwT=0,lastGap=0;
var msgEl=document.getElementById('msg'),hud=document.getElementById('hud');
function rs(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);
 off.width=W*D;off.height=H*D;octx.setTransform(D,0,0,D,0,0);if(stage==='draw'||stage==='show'){u=0;prev=null;stage='draw'}}
rs();addEventListener('resize',rs);
for(i=0;i<140;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,p:Math.random()*6});
function hx(t){return 16*Math.pow(Math.sin(t),3)}
function hy(t){return -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))}
function big(){return{sc:Math.min(W,H*.9)*.8/34,cx:W/2,cy:H/2-Math.min(H*.03,24)}}
function lapRot(n){return n===0?0:.2*Math.sin(n*.62)*(.4+.6*Math.min(n/12,1))}
function lapScale(n){return n===0?1:1+.045*Math.cos(n*1.7)}
function pos(uu,g){var n=Math.floor(uu),t=(uu-n)*Math.PI*2,x=hx(t),y=hy(t),r=lapRot(n),s=lapScale(n),c=Math.cos(r),sn=Math.sin(r);
 return[g.cx+(x*c-y*sn)*s*g.sc,g.cy+(x*sn+y*c)*s*g.sc]}
function spark(x,y,n,sp,h){for(var k=0;k<n;k++){var a=Math.random()*6.28,v=Math.random()*(sp||1.2);
 sparks.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.2,l:1,h:(h===undefined?270:h)+Math.random()*60})}}
function burst(x,y){for(var k=0;k<14;k++){var a=Math.random()*6.28,v=1+Math.random()*3;
 hearts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,l:1,s:12+Math.random()*16})}}
function firework(){var x=W*(.15+Math.random()*.7),y=H*(.12+Math.random()*.4),h=Math.random()<.5?285:325;
 for(var k=0;k<46;k++){var a=k/46*6.28,v=2+Math.random()*2.2;sparks.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1.4,h:h+Math.random()*30,g:1})}}
function say(t){msgEl.classList.remove('on');setTimeout(function(){msgEl.textContent=t;msgEl.classList.add('on')},900)}
function flap(){if(stage!=='play')return;if(!started){started=true;say('')}P.vy=-Math.max(330,H*.47)}
addEventListener('pointermove',function(e){if(stage==='intro')spark(e.clientX,e.clientY,3,1)});
addEventListener('pointerdown',function(e){if(stage==='show')burst(e.clientX,e.clientY);else flap()});
addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();flap()}});
document.getElementById('orb').onclick=function(e){e.stopPropagation();spark(e.clientX,e.clientY,70,4);document.getElementById('ui').classList.add('hide');
 P.x=W*.28;P.y=H*.5;P.vy=0;stage='play';last=performance.now();hud.textContent='0 / '+GOAL;setTimeout(function(){say('Tap to fly')},300)};
function addPipe(){var gap=Math.max(185,H*.36),m=90+gap/2,y=Math.min(Math.max(lastGap+(Math.random()-.5)*H*.4,m),H-m);if(!lastGap)y=H/2;lastGap=y;
 pipes.push({x:W+60,gy:y,gap:gap,pass:false})}
function drawStep(dt){
 var g=big(),n=Math.floor(u),speed=n===0?1:Math.min(1.5+n*.3,5),target=Math.min(u+dt*speed,LAPS),su=.004;
 octx.lineCap='round';octx.shadowColor='#b030ff';octx.shadowBlur=6;
 while(u<target){var nu=Math.min(u+su,target),p=pos(nu,g);
  if(prev&&Math.floor(nu)===Math.floor(u)){octx.strokeStyle='hsla('+(268+(nu/LAPS)*45)+',95%,'+(n===0?72:58)+'%,'+(n===0?.95:.5)+')';
   octx.lineWidth=n===0?1.6:.8;octx.beginPath();octx.moveTo(prev[0],prev[1]);octx.lineTo(p[0],p[1]);octx.stroke()}
  prev=p;u=nu}}
function frame(now){
 var dt=Math.min((now-last)/1000,.05);last=now;
 ctx.setTransform(D,0,0,D,0,0);ctx.clearRect(0,0,W,H);
 if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake-=1}
 for(i=0;i<stars.length;i++){var s=stars[i],a=.25+.45*Math.abs(Math.sin(now/1000+s.p));
  ctx.fillStyle='rgba(235,215,255,'+a+')';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.28);ctx.fill()}
 if(stage==='play'||stage==='win'){
  var PW=58,R=11,sp=Math.max(140,Math.min(190,H*.26));
  if(stage==='play'){
   if(started){P.vy+=Math.max(900,H*1.25)*dt;P.y+=P.vy*dt;
    if(P.y<R){P.y=R;P.vy=0}if(P.y>H-R){P.y=H-R;P.vy=-200}
    if(!pipes.length||pipes[pipes.length-1].x<W-300)addPipe()}
   else P.y=H*.5+Math.sin(now/300)*12;
   if(inv>0)inv-=dt;
   trail.push([P.x,P.y]);if(trail.length>30)trail.shift();
   for(i=pipes.length-1;i>=0;i--){var p=pipes[i];p.x-=sp*dt;
    if(p.x<-PW){pipes.splice(i,1);continue}
    if(!p.pass&&p.x+PW/2<P.x){p.pass=true;score++;hud.textContent=score+' / '+GOAL;spark(P.x,P.y,22,3,300);
     if(score>=GOAL){stage='win';winAt=now}}
    if(inv<=0&&Math.abs(P.x-p.x)<PW/2+R-2&&(P.y-R+2<p.gy-p.gap/2||P.y+R-2>p.gy+p.gap/2)){
     inv=1.4;shake=12;if(score>0){score--;hud.textContent=score+' / '+GOAL}spark(P.x,P.y,26,3,0)}}
  }else{if(trail.length)trail.shift()}
  if(stage==='win'){hud.style.opacity=0}
  /* gates */
  pipes.forEach(function(p){ctx.save();ctx.shadowColor='#a020f0';ctx.shadowBlur=18;ctx.strokeStyle='rgba(190,110,255,.95)';ctx.lineWidth=2.5;
   ctx.fillStyle='rgba(60,12,110,.55)';var x=p.x-PW/2,t=p.gy-p.gap/2,b=p.gy+p.gap/2;
   ctx.beginPath();ctx.rect(x,-10,PW,t+10);ctx.fill();ctx.stroke();ctx.beginPath();ctx.rect(x,b,PW,H-b+10);ctx.fill();ctx.stroke();ctx.restore()});
  /* trail + dot */
  for(i=1;i<trail.length;i++){ctx.strokeStyle='hsla('+(275+i*1.5)+',95%,65%,'+(i/trail.length*.8)+')';ctx.lineWidth=1+i/trail.length*5;ctx.lineCap='round';
   ctx.shadowColor='#b030ff';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(trail[i-1][0]-(trail.length-i)*2.2,trail[i-1][1]);ctx.lineTo(trail[i][0]-(trail.length-i-1)*2.2,trail[i][1]);ctx.stroke()}
  ctx.shadowBlur=0;
  if(stage==='play'){ctx.save();ctx.globalAlpha=inv>0&&Math.floor(now/90)%2?.35:1;ctx.fillStyle='#fff';ctx.shadowColor='#e090ff';ctx.shadowBlur=26;
   ctx.beginPath();ctx.arc(P.x,P.y,R,0,6.28);ctx.fill();ctx.restore()}
  if(stage==='win'&&now-winAt>900){stage='draw';pipes=[];say('You did it, '+NAME+' ✨')}
 }
 if(stage==='draw'||stage==='show'){
  var g=big();
  if(stage==='draw'&&now-winAt>1800){if(u<LAPS)drawStep(dt);else{stage='show';doneAt=now;fwT=0;
   var L=[NAME+', this was made just for you.','Every pixel begins with a line of code.','Tap anywhere — hearts will fly out.','Never lose your smile ✨'],k=0;
   (function nx(){say(L[k%L.length]);k++;setTimeout(nx,5200)})()}}
  var done=stage==='show',beat=done?1+.025*Math.sin((now-doneAt)/380):1;
  ctx.save();ctx.translate(g.cx,g.cy);ctx.scale(beat,beat);ctx.translate(-g.cx,-g.cy);
  ctx.globalCompositeOperation='lighter';ctx.shadowColor='#a020f0';ctx.shadowBlur=done?16:8;ctx.drawImage(off,0,0,W,H);ctx.restore();
  ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  if(u>=2&&!nameAt)nameAt=now;
  if(nameAt){ctx.save();ctx.globalAlpha=Math.min((now-nameAt)/900,1);ctx.fillStyle='#fff';ctx.shadowColor='#b44bff';ctx.shadowBlur=22;ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.font='italic 600 '+Math.min(W/6.5,70)+'px Fraunces,Georgia,serif';ctx.fillText(NAME,g.cx,g.cy-4);ctx.restore()}
  if(done||now-winAt>1800){var pu=done?((now-doneAt)/6000)%1:Math.min(u,LAPS-.001),pp=pos(pu,g);
   ctx.fillStyle='#fff';ctx.shadowColor='#e090ff';ctx.shadowBlur=22;ctx.beginPath();ctx.arc(pp[0],pp[1],done?3.2:4,0,6.28);ctx.fill();ctx.shadowBlur=0;
   if(!done&&Math.random()<.7)spark(pp[0],pp[1],1,1.4,280)}
  if(done){var al=Math.min((now-doneAt)/1200,1);
      ctx.font='13px serif';ctx.globalAlpha=al*.8;
   for(i=0;i<18;i++){var an=(now-doneAt)/5000+i/18*6.28;ctx.fillText('💜',g.cx+Math.cos(an)*g.sc*21,g.cy+Math.sin(an)*g.sc*17)}ctx.globalAlpha=1;
   fwT-=dt;if(fwT<=0){firework();fwT=.9+Math.random()*1.1}
   if(Math.random()<.08)hearts.push({x:Math.random()*W,y:H+10,vx:(Math.random()-.5)*.6,vy:-1-Math.random()*1.6,l:1,s:10+Math.random()*14});
   if(Math.random()<.012)shoot.push({x:Math.random()*W,y:Math.random()*H*.4,l:1});
   for(i=shoot.length-1;i>=0;i--){var sh=shoot[i];sh.x+=14;sh.y+=6;sh.l-=.03;if(sh.l<=0){shoot.splice(i,1);continue}
    ctx.strokeStyle='rgba(255,220,255,'+sh.l+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(sh.x-60,sh.y-26);ctx.stroke()}}
 }
 for(i=sparks.length-1;i>=0;i--){var q=sparks[i];q.x+=q.vx;q.y+=q.vy;q.vy+=q.g?.05:.02;if(q.g){q.vx*=.985;q.vy*=.985}q.l-=q.g?.012:.02;
  if(q.l<=0){sparks.splice(i,1);continue}
  ctx.fillStyle='hsla('+q.h+',100%,75%,'+Math.min(q.l,1)+')';ctx.beginPath();ctx.arc(q.x,q.y,1.8*Math.min(q.l,1)+.5,0,6.28);ctx.fill()}
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(i=hearts.length-1;i>=0;i--){var h=hearts[i];h.x+=h.vx;h.y+=h.vy;h.l-=.006;
  if(h.l<=0||h.y<-30){hearts.splice(i,1);continue}
  ctx.globalAlpha=Math.min(h.l*1.5,1);ctx.font=h.s+'px serif';ctx.fillText('💜',h.x,h.y);ctx.globalAlpha=1}
 requestAnimationFrame(frame)}
requestAnimationFrame(function(t){last=t;frame(t)});
})();
</script>
</body>
</html>
